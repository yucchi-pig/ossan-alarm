<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17120e">
<title>関西のおっさん目覚まし</title>
<style>
body{background:#17120e;color:#f5e6c8;font-family:sans-serif;text-align:center;padding:30px 15px}
h1{font-size:28px}.clock{font-size:48px;margin:30px 0}
input,button{font-size:20px;padding:12px;margin:8px;border-radius:10px}
button{background:#5b3824;color:white;border:1px solid #9b7655}#message{margin-top:25px}
</style>
</head>
<body>
<h1>👴 関西のおっさん目覚まし</h1>
<div class="clock" id="clock">00:00:00</div>
<input type="time" id="alarm"><br>
<button onclick="setAlarm()">⏰ アラーム設定</button>
<button onclick="testAlarm()">📢 おっさんを呼ぶ</button>
<div id="message">まだ寝とるんか？</div>
<audio id="sound" src="ossan.mp3" preload="auto"></audio>
<script>
let alarmTime="";
const clock=document.getElementById("clock");
const message=document.getElementById("message");
const sound=document.getElementById("sound");
function setAlarm(){
 alarmTime=document.getElementById("alarm").value;
 message.textContent=alarmTime?"⏰ "+alarmTime+" に起こしたるで。":"時間を入れてやー。";
}
function testAlarm(){
 sound.currentTime=0;
 sound.play().catch(()=>message.textContent="🔊 先にもう一度『おっさんを呼ぶ』を押して音声を許可してやー。");
}
setInterval(()=>{
 const n=new Date();
 const t=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0")+":"+String(n.getSeconds()).padStart(2,"0");
 clock.textContent=t;
 if(alarmTime && alarmTime===t.slice(0,5)){
  sound.currentTime=0;
  sound.play().catch(()=>{});
  message.textContent="👴 おーい！起きやー！！";
 }
},1000);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
